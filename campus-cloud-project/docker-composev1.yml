services:
#=================================
# POSTGRESQL
#================================
  postgres-cloud:
    image: postgres:16-bookworm
    container_name: campuscloud-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: CampusCloudPostgres?
      POSTGRES_DB: campuscloud
    ports:
      - "54320:5432"
    volumes:
      - campuscloud_postgres_data:/var/lib/postgresql/data
    networks:
      - campus-network


#=================================
# PGADMIN
#================================
  pgadmin:
    image: dpage/pgadmin4:6.17
    container_name: campuscloud-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8082:80"
    volumes:
      - campuscloud_pgadmin_data:/var/lib/pgadmin
    networks:
      - campus-network

#=================================
# VOLUMES
#================================
volumes:
  campuscloud_postgres_data:
    external: true

  campuscloud_pgadmin_data:
    external: true
  
#=================================
# RED
#================================ 
networks:
  campus-network:
    external: true
